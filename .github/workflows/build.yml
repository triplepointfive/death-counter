name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --windowed --icon=skull.ico --name "Death Counter" death_counter.py

      - uses: actions/upload-artifact@v4
        with:
          name: Death-Counter-Windows
          path: dist/Death Counter.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --windowed --name "Death Counter" death_counter.py

      - uses: actions/upload-artifact@v4
        with:
          name: Death-Counter-Linux
          path: dist/Death Counter

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Death-Counter-Windows

      - uses: actions/download-artifact@v4
        with:
          name: Death-Counter-Linux
          path: linux

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Death Counter.exe
            linux/Death Counter
          generate_release_notes: true
